<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Planet">
  <defs>
    <radialGradient id="pl-ocean" cx="34%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#a9d4ff"/>
      <stop offset="30%" stop-color="#3f86e6"/>
      <stop offset="66%" stop-color="#1f4fae"/>
      <stop offset="100%" stop-color="#0a1f45"/>
    </radialGradient>
    <radialGradient id="pl-night" cx="74%" cy="78%" r="80%">
      <stop offset="0%" stop-color="#02030c" stop-opacity="0"/>
      <stop offset="58%" stop-color="#02030c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#010208" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="pl-atmo" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#4aa8ff" stop-opacity="0"/>
      <stop offset="90%" stop-color="#4aa8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7ec2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b74ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b74ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pl-spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pl-clip"><circle cx="150" cy="150" r="110"/></clipPath>
    <filter id="pl-blur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="pl-blur2"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <!-- starfield -->
  <g fill="#cfe0ff">
    <circle cx="24" cy="40" r="1.1" opacity="0.9"/><circle cx="60" cy="18" r="0.8" opacity="0.6"/>
    <circle cx="270" cy="52" r="1.2" opacity="0.85"/><circle cx="288" cy="120" r="0.9" opacity="0.6"/>
    <circle cx="18" cy="180" r="0.9" opacity="0.7"/><circle cx="44" cy="262" r="1.1" opacity="0.8"/>
    <circle cx="255" cy="250" r="0.9" opacity="0.6"/><circle cx="282" cy="210" r="1.2" opacity="0.85"/>
    <circle cx="130" cy="12" r="0.8" opacity="0.5"/><circle cx="200" cy="286" r="1" opacity="0.7"/>
  </g>

  <!-- outer glow + atmosphere -->
  <circle cx="150" cy="150" r="150" fill="url(#pl-glow)"/>
  <circle cx="150" cy="150" r="124" fill="url(#pl-atmo)"/>

  <!-- ocean base -->
  <circle cx="150" cy="150" r="110" fill="url(#pl-ocean)"/>

  <!-- continents + clouds clipped to the globe -->
  <g clip-path="url(#pl-clip)">
    <g fill="#2f7d54" opacity="0.9" filter="url(#pl-blur2)">
      <path d="M70 96 q28 -20 54 -8 q18 8 8 30 q-14 24 -44 20 q-30 -6 -18 -42z"/>
      <path d="M150 150 q34 -6 52 14 q14 18 -6 40 q-30 26 -58 6 q-20 -18 -8 -42 q8 -14 20 -18z"/>
      <path d="M92 190 q22 -6 30 12 q6 20 -16 26 q-26 4 -30 -18 q-2 -16 16 -20z"/>
    </g>
    <g fill="#3a9a63" opacity="0.55">
      <path d="M120 110 q16 -6 22 8 q4 14 -12 16 q-16 0 -16 -14z"/>
      <path d="M170 168 q14 -2 18 12 q0 12 -16 12 q-14 -2 -10 -16z"/>
    </g>
    <!-- clouds -->
    <g fill="#eef5ff" opacity="0.42" filter="url(#pl-blur)">
      <path d="M60 130 q30 -14 62 -6 q26 8 60 2 q-20 22 -66 18 q-40 -2 -56 -14z"/>
      <path d="M100 214 q34 -12 74 -2 q-18 18 -52 16 q-24 -2 -22 -14z"/>
      <path d="M150 78 q26 -8 48 4 q-16 14 -44 10 q-16 -4 -4 -14z"/>
    </g>
    <!-- day/night terminator -->
    <circle cx="150" cy="150" r="110" fill="url(#pl-night)"/>
    <!-- specular sun-glint -->
    <ellipse cx="112" cy="108" rx="34" ry="22" fill="url(#pl-spec)" opacity="0.5"/>
  </g>

  <!-- crisp atmosphere rim on the lit limb -->
  <circle cx="150" cy="150" r="110" fill="none" stroke="#9fccff" stroke-width="1.2" opacity="0.5"/>
  <path d="M64 92 A110 110 0 0 1 214 76" fill="none" stroke="#dbeaff" stroke-width="2" opacity="0.6" filter="url(#pl-blur2)"/>

  <!-- distant moon -->
  <circle cx="258" cy="70" r="12" fill="#c3ccdb"/>
  <circle cx="258" cy="70" r="12" fill="url(#pl-night)" opacity="0.8"/>
  <circle cx="254" cy="66" r="2.4" fill="#9aa4b6"/><circle cx="262" cy="74" r="1.8" fill="#9aa4b6"/>
</svg>
