<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Editable knowledge cell — holographic data panel">
  <defs>
    <linearGradient id="ec-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2532"/><stop offset="100%" stop-color="#0a1a26"/>
    </linearGradient>
    <linearGradient id="ec-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b74ff"/><stop offset="100%" stop-color="#b48bff"/>
    </linearGradient>
    <linearGradient id="ec-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b74ff"/><stop offset="100%" stop-color="#7aa6ff"/>
    </linearGradient>
    <filter id="ec-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- HUD frame -->
  <g stroke="#3a5a9e" stroke-width="1" fill="none" opacity="0.7">
    <path d="M14 30 L14 14 L30 14"/><path d="M346 30 L346 14 L330 14"/>
    <path d="M14 230 L14 246 L30 246"/><path d="M346 230 L346 246 L330 246"/>
  </g>
  <g font-family="'IBM Plex Mono',monospace" font-size="7" fill="#5570a8">
    <text x="20" y="24">KNOWLEDGE_CELL</text><text x="300" y="24">v.14</text>
  </g>

  <!-- circuit traces feeding the cell -->
  <g fill="none" stroke="#2a4a7a" stroke-width="1">
    <path d="M18 96 H54 V120 H88"/><path d="M18 150 H40 V168 H88"/>
    <path d="M342 110 H300 V132 H272"/><path d="M342 176 H316 V150 H272"/>
  </g>
  <g fill="#4aa8ff">
    <circle cx="18" cy="96" r="2"/><circle cx="18" cy="150" r="2"/><circle cx="342" cy="110" r="2"/><circle cx="342" cy="176" r="2"/>
    <circle cx="54" cy="120" r="1.5" fill="#243c66"/><circle cx="316" cy="150" r="1.5" fill="#243c66"/>
  </g>

  <!-- depth backplate -->
  <rect x="96" y="72" width="176" height="122" rx="13" fill="#050f16" opacity="0.7"/>
  <!-- main plate -->
  <rect x="88" y="64" width="176" height="122" rx="13" fill="url(#ec-plate)" stroke="url(#ec-edge)" stroke-width="1.4"/>
  <!-- header -->
  <path d="M88 77 a13 13 0 0 1 13 -13 h150 a13 13 0 0 1 13 13 v13 h-176 z" fill="#101f38"/>
  <circle cx="105" cy="77" r="4" fill="#4ade80" filter="url(#ec-glow)"/>
  <text x="116" y="80.5" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#7aa6ff">principle_042</text>
  <rect x="228" y="70" width="28" height="15" rx="7.5" fill="rgba(47,224,160,0.16)" stroke="#2fe0a0" stroke-width="0.8"/>
  <text x="242" y="80.5" font-family="Inter" font-size="8" fill="#6ee7b7" text-anchor="middle">T2</text>

  <!-- body: condition -->
  <text x="104" y="112" font-family="'IBM Plex Mono',monospace" font-size="9.5" fill="#9fb6c4">if reg_alpha &gt; 0.3</text>
  <text x="104" y="128" font-family="'IBM Plex Mono',monospace" font-size="9.5" fill="#6a8494">→ helps hard data</text>

  <!-- confidence slider -->
  <text x="104" y="150" font-family="Inter" font-size="8" fill="#6b82b0">confidence</text>
  <rect x="104" y="156" width="144" height="6" rx="3" fill="#14284a"/>
  <rect x="104" y="156" width="101" height="6" rx="3" fill="url(#ec-fill)"/>
  <g filter="url(#ec-glow)"><circle cx="205" cy="159" r="7" fill="#7aa6ff"/><circle cx="205" cy="159" r="7" fill="none" stroke="#eef4ff" stroke-width="1"/></g>
  <text x="252" y="162" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#7aa6ff" text-anchor="end" transform="translate(-4,0)">0.71</text>

  <!-- footer -->
  <line x1="104" y1="172" x2="248" y2="172" stroke="#1c3050" stroke-width="0.8"/>
  <text x="104" y="182" font-family="Inter" font-size="7.5" fill="#4d6f7d">human_edit · replayable at any seq</text>

  <!-- edit stylus -->
  <g transform="translate(224 168) rotate(38)" filter="url(#ec-glow)">
    <rect x="-2.4" y="-2" width="26" height="6.5" rx="2.4" fill="#ffb43c"/>
    <path d="M23.6 -2 L31 1.2 L23.6 4.5 Z" fill="#fde68a"/>
    <rect x="-6" y="-2" width="4" height="6.5" rx="1.5" fill="#a16207"/>
  </g>
</svg>
